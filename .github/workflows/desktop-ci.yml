name: Desktop

on:
  push:
  pull_request:

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.100
      - run: dotnet restore ClusterJAM.Desktop.slnx
      - run: dotnet format ClusterJAM.Desktop.slnx --verify-no-changes --no-restore
      - run: dotnet build ClusterJAM.Desktop.slnx --configuration Release --no-restore --warnaserror
      - run: dotnet test ClusterJAM.Desktop.slnx --configuration Release --no-build --no-restore
